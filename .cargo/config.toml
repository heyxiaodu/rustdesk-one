[target.x86_64-pc-windows-msvc]
rustflags = ["-Ctarget-feature=+crt-static"]
# NO `linker` key in this table on purpose (NERV Desk, 2026-10-02). A `linker`
# key here applies to EVERY host, so the Linux-only bash shim
# (scripts/msvc-shim/link.sh, which translates rustc's msvc argv for lld-link-19)
# was also handed to native Windows runners; rustc tried to exec it and died with
#   error: could not exec the linker `D:\a\...\scripts/msvc-shim/link.sh`
#   note: %1 is not a valid Win32 application. (os error 193)
# which broke `Build rustdesk` in CI (github.com/heyxiaodu/rustdesk-one run 37013759486).
# The shim is supplied from the environment only:
#   CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER  (exported by scripts/cross-msvc.env,
#   which scripts/cross-build-msvc.sh sources; env vars beat this file anyway).
# Cross builds must therefore go through that script (see the note below): a bare
# `cargo build --target=x86_64-pc-windows-msvc` on Linux now leaves cargo with the
# default linker and will fail to link.
# ---------------------------------------------------------------------------
# NOTE (NERV Desk, m09628): the CC_/CXX_/AR_/CFLAGS_/CXXFLAGS_/KCP_SYS_*/NERV_*
# keys that used to live here as `{ value = "...", force = "false" }` were
# REMOVED because cargo does NOT export `[target.<triple>]` keys as environment
# variables to build scripts. Verified empirically: a build script running under
# `--target=x86_64-pc-windows-msvc` saw `CC_x86_64_pc_windows_msvc = None` even
# though the key was present in this table.
#
# Consequence of the old (inert) form: cc-rs fell back to a bare host `clang`
# from PATH, which emitted **ELF** .o files, and `lib.exe` then failed with
#   "not a COFF object, bitcode, archive, import library or resource file".
#
# Cross builds must therefore source the environment explicitly:
#     scripts/cross-build-msvc.sh --features quic
# or  set -a; . scripts/cross-msvc.env; set +a; cargo build --target=... 
#
# A global `[env]` block is NOT a substitute: the global-named key
# KCP_SYS_EXTRA_HEADER_PATH would leak into host (linux-gnu) builds and break
# kcp-sys's bindgen on MSVC `<vadefs.h>` (regression history: m09301/m09349).
# ---------------------------------------------------------------------------
[target.i686-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-args=/NODEFAULTLIB:MSVCRT"]
[target.aarch64-pc-windows-msvc]
rustflags = ["-Ctarget-feature=+crt-static"]
[target.'cfg(target_os="macos")']
rustflags = [
    "-C", "link-args=-sectcreate __CGPreLoginApp __cgpreloginapp /dev/null",
]
#[target.'cfg(target_os="linux")']
# glibc-static required, this may fix https://github.com/rustdesk/rustdesk/issues/9103, but I do not want this big change
# this is unlikely to help also, because the other so files still use libc dynamically
#rustflags = [
#    "-C", "link-args=-Wl,-Bstatic -lc -Wl,-Bdynamic"
#]
[net]
git-fetch-with-cli = true

# === NERV Desk: Windows x86_64-msvc cross-compile shim (Phase-2 windows-msvc gate) ===
# When the host is Linux and target is x86_64-pc-windows-msvc, the upstream
# toolchain (`cc-rs` + the bundled xwin MSVC STL) demands `clang 19+` for any
# C++ transitive dep (webm-sys, mozjpeg-sys). scripts/msvc-shim/clang-wrap.sh
# forces clang-19 (apt installed 1:19.1.7-3~deb12u1) and injects
# --target=x86_64-pc-windows-msvc.
#
# The shim scripts are versioned in this repository. The xwin SDK
# ($HOME/.xwin) and the cross-built COFF .lib archives
# (analysis/build-env/nervdesk-*-msvc) are NOT — see scripts/cross-msvc.env for
# their default locations and the NERV_* overrides.
#
# NOTE: the NERV_* / CC_* / CFLAGS_* values deliberately do NOT live in this
# file. Cargo does not export `[target.<triple>]` keys as environment variables
# to build scripts, so they are sourced from scripts/cross-msvc.env by
# scripts/cross-build-msvc.sh. A global `[env]` block is not a substitute:
# KCP_SYS_EXTRA_HEADER_PATH would leak into host (x86_64-unknown-linux-gnu)
# builds and break kcp-sys's bindgen on MSVC `<vadefs.h>` / `<vcruntime.h>`
# (regression history: m09301/m09349).