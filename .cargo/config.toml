[target.x86_64-pc-windows-msvc]
rustflags = ["-Ctarget-feature=+crt-static"]
linker = "/tmp/nervdesk-msvc-shim/link.sh"
# ---------------------------------------------------------------------------
# NOTE (NERV Desk, m09628): the CC_/CXX_/AR_/CFLAGS_/CXXFLAGS_/KCP_SYS_*/NERV_*
# keys that used to live here as `{ value = "...", force = "false" }` were
# REMOVED because cargo does NOT export `[target.<triple>]` keys as environment
# variables to build scripts. Verified empirically: a build script running under
# `--target=x86_64-pc-windows-msvc` saw `CC_x86_64_pc_windows_msvc = None` even
# though the key was present in this table.
#
# Consequence of the old (inert) form: cc-rs fell back to a bare host `clang`
# from PATH, which emitted **ELF** .o files, and `lib.exe` then failed with
#   "not a COFF object, bitcode, archive, import library or resource file".
#
# Cross builds must therefore source the environment explicitly:
#     scripts/cross-build-msvc.sh --features quic
# or  set -a; . scripts/cross-msvc.env; set +a; cargo build --target=... 
#
# A global `[env]` block is NOT a substitute: the global-named key
# KCP_SYS_EXTRA_HEADER_PATH would leak into host (linux-gnu) builds and break
# kcp-sys's bindgen on MSVC `<vadefs.h>` (regression history: m09301/m09349).
# ---------------------------------------------------------------------------
[target.i686-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-args=/NODEFAULTLIB:MSVCRT"]
[target.aarch64-pc-windows-msvc]
rustflags = ["-Ctarget-feature=+crt-static"]
[target.'cfg(target_os="macos")']
rustflags = [
    "-C", "link-args=-sectcreate __CGPreLoginApp __cgpreloginapp /dev/null",
]
#[target.'cfg(target_os="linux")']
# glibc-static required, this may fix https://github.com/rustdesk/rustdesk/issues/9103, but I do not want this big change
# this is unlikely to help also, because the other so files still use libc dynamically
#rustflags = [
#    "-C", "link-args=-Wl,-Bstatic -lc -Wl,-Bdynamic"
#]
[net]
git-fetch-with-cli = true

# === NERV Desk: Windows x86_64-msvc cross-compile shim (Phase-2 windows-msvc gate) ===
# When the host is Linux and target is x86_64-pc-windows-msvc, the upstream
# toolchain (`cc-rs` + the bundled xwin MSVC STL) demands `clang 19+` for any
# C++ transitive dep (webm-sys, mozjpeg-sys). The shim below points CC / CXX
# at /tmp/nervdesk-msvc-shim/clang-wrap.sh, which forces clang-19 (apt
# installed 1:19.1.7-3~deb12u1) and injects --target=x86_64-pc-windows-msvc.
# To use, also point NERV_SODIUM_LIB_DIR at analysis/build-env/nervdesk-sodium-msvc
# (contains the cross-compiled libsodium.lib). The env values below match the
# on-host layout of this NERVDesk workspace; override per build server as needed.
#
# IMPORTANT: All NERV_* env vars and KCP_SYS_EXTRA_HEADER_PATH live inside the
# `[target.x86_64-pc-windows-msvc]` block above so they only apply to
# windows-msvc builds. A global `[env]` block would leak them into host
# (x86_64-unknown-linux-gnu) builds, where kcp-sys's bindgen would pick up
# KCP_SYS_EXTRA_HEADER_PATH and choke on MSVC `<vadefs.h>` / `<vcruntime.h>`
# (`__declspec` errors). See m09301/m09349 for the regression history.