[package]
name = "rustdesk-portable-packer"
version = "1.5.0"
edition = "2021"
description = "RustDesk Remote Desktop"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

build = "build.rs"

[dependencies]
brotli = "3.4"
dirs = "5.0"
md5 = "0.7"
winapi = { version = "0.3", features = ["winbase", "libloaderapi"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Wdk",
    "Wdk_System",
    "Wdk_System_SystemServices",
    "Win32",
    "Win32_System",
    "Win32_System_SystemInformation",
] }
native-windows-gui = {version = "1.0", default-features = false, features = ["animation-timer", "image-decoder"]}

[package.metadata.winres]
# Keep the upstream rightsholder visible in the shipped self-extracting
# executable, and do not claim "all rights reserved." on a work published under
# the AGPLv3. See NOTICE at the repository root. Keep this string in sync with
# Cargo.toml and flutter/windows/runner/Runner.rc.
LegalCopyright = "Copyright (C) 2026 NERVDESK and contributors. Based on RustDesk, Copyright (C) Purslane Tech Pte. Ltd. and contributors. Licensed under AGPLv3."
ProductName = "RustDesk"
OriginalFilename = "rustdesk.exe"
FileDescription = "RustDesk Remote Desktop"
#ProductVersion = ""

[target.'cfg(target_os="windows")'.build-dependencies]
winres = "0.1"
winapi = { version = "0.3", features = [ "winnt", "pdh", "synchapi" ] }


