# ############################################################################
#  NervDesk 定制版（一期）· Windows x64 —— custom-windows-nervdesk.yml
#  （t5 骨架 · t6 装配完成）
# ############################################################################
#  基于 build/fork-push/.github/workflows/custom-windows-iroh-branded.yml
#  （iroh 默认开启 + 品牌装配），按 docs/09 M6 增加 5 处 CI 能力：
#
#    A.【M6-1 硬约束】io_loop/connection 接线补丁：构建前强制应用并自检
#        ⚠️ 历史教训（docs/02 §18 / build/next-session-handoff.md）：
#        缺接线则产物带 iroh 但升级**永不触发**（真机日志零 iroh 活动）。
#        本步骤先查标记（drive_iroh_upgrade / IROH_TICK_INTERVAL），
#        缺则 git apply patches/io_loop-iroh-hook.patch +
#        patches/connection-iroh-hook.patch，再查仍缺 = 立即失败。
#    B.【M6-2 Secret 管线】NERVDESK_PASSWORD（替换 __NERVDESK_PASSWORD__，
#        固定密码+PIN）与 NERVDESK_RELAY_TOKEN（替换 __NERVDESK_RELAY_TOKEN__，
#        relay 访问令牌）只从 GitHub Actions Secret 读取，**不写进本文件**；
#        Secret 未配置 → 构建在 checkout 后立刻明确失败（不静默用假值）。
#    C.【t2/t3/t4 + t18 fixes 装配完成】按「A档品牌 → t2(features) →
#        t3(network-service) → t4(branding-depth) → t18(nervdesk-fixes)」
#        依赖顺序执行各目录的 apply_*.py 锚点自检脚本：
#        锚点匹配数 != 1 即失败 / CRLF 自适应 / 应用后校验 / 占位符纪律
#        （__NERVDESK_PASSWORD__ / __NERVDESK_RELAY_TOKEN__ 只允许出现在
#        config.rs 的 const 与守卫位置）；目录或脚本缺失 = 立即失败。
#        装配后汇总自检关键标记；占位符由步骤 8（Secret 替换）在编译前换成真值。
#    D.【M6-3 占位符自测钩子】构建产物（rustdesk 目录 + SignOutput）
#        grep 不得含 "__NERVDESK_" 前缀占位符原样，含 → 构建失败。
#    E.【M3-1 产物改名】t4 品牌补丁 BINARY_NAME → nervdesk：本 workflow 的
#        便携打包输入、SignOutput 产物与 Release 文件随之改为 nervdesk-*。
#    G.【t12 双变体】build-windows-x64 为矩阵（mode=controlled|controller）：
#        补丁装配链对两变体字节一致，仅在构建参数处区分——Rust 侧
#        env NERVDESK_MODE（option_env!）+ Flutter 侧 --dart-define（build.py
#        dart-define 注入步骤同步追加），两通道缺一不可（UI 与逻辑才一致）。
#        产物 nervdesk-controlled-* / nervdesk-controller-*（各 exe+msi）；
#        Release 由 publish-release job 在**同一 TAG** 下发布两套产物集。
#        全部硬约束（接线/Secret 闸门/F1 不变量+守卫语义/M6-3 扫描）在矩阵内
#        定义一次、对每个变体各自完整执行。
#    F. 其余步骤与 custom-windows-iroh-branded.yml 完全一致（工具链/缓存/
#        打包/发布逐字保留，避免破坏已验证的构建路径）。
#
#  ============================================================================
#  怎么用（fork 侧）：
#    1. fork rustdesk/rustdesk（AGPL-3.0，保持 Public），基于 1.4.9 tag
#       新建分支 nervdesk-custom-windows-1.4.9
#    2. 把本文件上传到该分支 .github/workflows/custom-windows-nervdesk.yml
#       （上传即 push，自动触发构建；也可在 Actions 页手动 Run workflow）
#    3. 分支上必须同时带上（tools/push_nervdesk_custom.py 会自动组装）：
#         nervdesk/  iroh 模块模板（stream.rs / iroh_transport.rs 等）
#         nervdesk/branding-apply.py + nervdesk/branding/*.ico（A 档品牌）
#         patches/io_loop-iroh-hook.patch + patches/connection-iroh-hook.patch
#         patches/nervdesk-features/        （t2：补丁 + apply_nervdesk_features.py）
#         patches/nervdesk-network-service/ （t3：补丁 + apply_nervdesk_network_service.py）
#         patches/nervdesk-branding-depth/  （t4：补丁 + apply_nervdesk_branding_depth.py）
#    4. 在 fork 仓库 Settings → Secrets and variables → Actions 配置：
#         NERVDESK_PASSWORD  固定密码/PIN 真值（绝不入库、绝不打印）
#         NERVDESK_RELAY_TOKEN  relay 访问令牌（对应 access.shared_token）
#       未配置这两个 Secret → 构建明确失败（见步骤 3）。
#    5. 【t12 双变体 · 如何触发与产物对照】一次构建（workflow_dispatch /
#       push 到 nervdesk-custom-windows-**）自动跑矩阵两腿，无需额外参数：
#
#         | 变体（matrix.mode） | 形态（t11 编译期开关）        | 产物（SignOutput / Release）                          |
#         |---|---|---|
#         | controlled          | 纯被控端：托盘隐藏、连接管理器隐藏、ID 直连/发起入口移除、出站会话拒绝（session_add bail），仅密钥/服务常驻 | nervousdesk-controlled-1.4.9-x86_64.exe / .msi |
#         | controller          | 控制端：托盘保留、连接管理器/ID 直连保留、可发起会话     | nervdesk-controller-1.4.9-x86_64.exe / .msi  |
#
#       Release 页同一 TAG（默认 nervdesk-custom-1.4.9-r12，iroh 直连地址交换修复（真机 connect 修复），旧 TAG
#       保留可回退）下出现两组文件
#       （controlled* / controller*，各 exe+msi）；TAG 可改，同一 TAG 只能
#       成功一次，重跑换名。两变体语义表（含「未设置=默认」列）见
#       patches/nervdesk-features/nervdesk-features-change-list.md §2.7。
#    6. 旧 workflow 已废弃（M6-6）：custom-windows-iroh-branded.yml 等由
#       推送脚本从分支删除；本文件夹内的旧文件已标 DEPRECATED + 迁移说明。
#  ============================================================================

name: Build NervDesk Custom Windows x64 (iroh wired)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布标签（同一标签只能成功一次，重跑请换个名字）'
        required: true
        default: 'nervdesk-custom-1.4.9-r12'
  # 推送到 nervdesk-custom-windows- 开头的分支时自动构建。
  # （与 Android 的 nervdesk-custom-android-** 不重叠，避免双 workflow 误触发）
  push:
    branches:
      - 'nervdesk-custom-windows-**'

# 发布 Release 需要写权限
permissions:
  contents: write

env:
  # ---------------- 你的服务器信息：只改这一段 ----------------
  RS_ID_SERVER: "id.nervcode.eu.org"
  RS_RELAY_SERVER: "api.nervcode.eu.org"   # r5/t23：2.x ws relay 裸域（勿加 :21117）
  RS_API_SERVER: "https://api.nervcode.eu.org"
  RS_KEY: "HJtH5YUqy6Dz8FHfypUKPJSGoxbBeSgtDsahkT6MBo4="
  # -----------------------------------------------------------
  # 注意：NERVDESK_PASSWORD / NERVDESK_RELAY_TOKEN 不放在这里——
  # 密钥值绝不写进 workflow 文件，只在需要它们的步骤里用
  # ${{ secrets.* }} 读取（见「Guard CI secrets」与「Replace placeholder」两步骤）。

  # 以下与官方 CI 保持一致，一般不要动
  VERSION: "1.4.9"
  FLUTTER_VERSION: "3.24.5"
  LLVM_VERSION: "15.0.6"
  SCITER_RUST_VERSION: "1.91"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  TAG_NAME: ${{ github.event.inputs.release_tag || 'nervdesk-custom-1.4.9-r12' }}
  UPLOAD_ARTIFACT: "true"
  # 固定成 "-2"：官方 CI 用这个值判断"跳过需要 RustDesk 私钥的代码签名"。
  # 我们没有他们的签名服务，跳过是对的（代价是首次运行会有 SmartScreen 提示）。
  SIGN_BASE_URL: "-2"

jobs:
  # 生成 flutter_rust_bridge 胶水代码（官方必需步骤）
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  # 编译任务栏窗口辅助程序（官方必需步骤）
  build-topmost-window:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  # ======================================================================
  # 【t12 双变体】同一矩阵覆盖 controlled（纯被控端）与 controller（控制端）
  # 两个编译期形态（t11：NERVDESK_MODE）。补丁装配链（接线/品牌/t2~t4/
  # 占位符替换/服务器注入）对两个变体完全一致，只在「构建参数」处区分：
  #   - Rust 侧：Build 步骤 env NERVDESK_MODE=${{ matrix.mode }}（option_env!）
  #   - Flutter 侧：dart-define 注入步骤把 --dart-define=NERVDESK_MODE=...
  #     追加进 build.py 的 'flutter build windows --release'（String.fromEnvironment）
  # 两通道缺一不可；产物命名 nervdesk-controlled-* / nervdesk-controller-*
  # （exe/msi），Release 同一 TAG 下一个产物集两组文件。
  # 全部硬约束（接线第5步、Secret 闸门、F1 不变量+守卫语义、M6-3 扫描）
  # 在该矩阵 job 内定义一次、随矩阵对每个变体各自完整执行。
  # ======================================================================
  build-windows-x64:
    name: Windows x64 (${{ matrix.mode }})
    needs: [generate-bridge, build-topmost-window]
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        mode: [controlled, controller]
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      # ======================================================================
      # 【M6-2 密钥管线 · 前置闸门】Secret 必须配齐，缺一个就立刻失败。
      # 绝不"用空串当假值继续构建"——占位符没替换就发布是最坏的情况。
      # ======================================================================
      - name: Guard CI secrets (NERVDESK_PASSWORD / NERVDESK_RELAY_TOKEN)
        shell: bash
        env:
          NERVDESK_PASSWORD: ${{ secrets.NERVDESK_PASSWORD }}
          NERVDESK_RELAY_TOKEN: ${{ secrets.NERVDESK_RELAY_TOKEN }}
        run: |
          ok=1
          if [ -z "$NERVDESK_PASSWORD" ]; then
            echo "::error::Secret NERVDESK_PASSWORD 未配置：请在 fork 仓库 Settings → Secrets and variables → Actions 配置固定密码/PIN 真值。"
            ok=0
          fi
          if [ -z "$NERVDESK_RELAY_TOKEN" ]; then
            echo "::error::Secret NERVDESK_RELAY_TOKEN 未配置：请在 fork 仓库 Settings → Secrets and variables → Actions 配置 relay 访问令牌。"
            ok=0
          fi
          [ "$ok" = 1 ]

      # ======================================================================
      # 关键步骤：在这里把你的服务器信息写进源码
      # 改动 3 处，编译前进不来就立刻报错，不会白等 1 小时才发现
      # ======================================================================
      # libs/hbb_common 是 git 子模块：GitHub 的 Contents API 无法直接往里写文件
      # （会返回 409/404），而且 Windows 上 git apply 容易因 CRLF 失配。
      # 所以模块模板放在 nervdesk/ 下，这里在构建前把它落到源码树里。
      - name: Apply iroh source changes
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          python3 - <<'PYEOF'
          import pathlib, shutil, sys
          try:
              sys.stdout.reconfigure(encoding="utf-8", errors="replace")
              sys.stderr.reconfigure(encoding="utf-8", errors="replace")
          except Exception:
              pass

          def die(m):
              print("[FAIL] " + m, file=sys.stderr, flush=True); sys.exit(1)

          def read_text(p):
              raw = pathlib.Path(p).read_bytes().decode("utf-8")
              crlf = "\r\n" in raw
              return (raw.replace("\r\n", "\n") if crlf else raw), crlf

          def write_text(p, text, crlf):
              pathlib.Path(p).write_bytes((text.replace("\n", "\r\n") if crlf else text).encode("utf-8"))

          def sub(text, old, new, label):
              n = text.count(old)
              if n != 1: die("%s: 锚点匹配 %d 处，期望 1 处" % (label, n))
              return text.replace(old, new)

          # 1) 新增两个模块：iroh 传输 + 传输切换时的加密状态迁移
          mods = ["iroh_transport.rs", "crypto_handoff.rs", "iroh_upgrade.rs", "iroh_upgrade_session.rs", "iroh_transition.rs"]

          # stream.rs 是"替换已有文件"，不是新增。
          # 加一道哈希守卫：万一上游改了这个文件，宁可响亮失败也不要静默覆盖。
          expected_sha = "bb541d243e0c7b8c22c82ff0acfd6e2fa0ed792acb57427a1d10852e46392d11"
          p_stream = pathlib.Path("libs/hbb_common/src/stream.rs")
          import hashlib
          # 必须先归一化行尾再比对：.gitattributes 是 `* text=auto`，
          # Windows 上 checkout 出来是 CRLF，而仓库里存的是 LF。
          raw = p_stream.read_bytes()
          normalized = raw.replace(b"\r\n", b"\n")
          actual = hashlib.sha256(normalized).hexdigest()
          if actual != expected_sha:
              die("libs/hbb_common/src/stream.rs 与预期版本不一致（上游可能改过），拒绝覆盖")
          shutil.copyfile("nervdesk/stream.rs", p_stream)
          dst_dir = pathlib.Path("libs/hbb_common/src")
          if not dst_dir.is_dir(): die("子模块 libs/hbb_common 没拉下来")
          for name in mods:
              src = pathlib.Path("nervdesk") / name
              if not src.is_file(): die("缺少 nervdesk/%s" % name)
              shutil.copyfile(src, dst_dir / name)

          # 2) libs/hbb_common/Cargo.toml
          p = "libs/hbb_common/Cargo.toml"
          t, crlf = read_text(p)
          t = sub(t, 'webrtc = ["dep:webrtc"]\n',
                     'webrtc = ["dep:webrtc"]\n'
                     '# 用 iroh(QUIC) 承载点对点数据通道（iroh 版构建）。\n'
                     '# 开启后可用 `cargo check -p hbb_common --features iroh-transport` 验证。\n'
                     '#\n'
                     '# 注意：iroh 1.2 的 MSRV 是 rustc 1.91，而 RustDesk 的 CI 锁定 1.75\n'
                     '# （1.75 是为了 sciter 旧 UI）。启用本 feature 必须同时抬高工具链版本。\n'
                     'iroh-transport = ["dep:iroh"]\n', p)
          t = sub(t, 'libloading = "0.8"\n',
                     'libloading = "0.8"\n'
                     '# QUIC 传输（可选，见 feature iroh-transport）。锁死小版本，避免 API 漂移。\n'
                     'iroh = { version = "1.2", optional = true }\n', p)
          write_text(p, t, crlf)

          # 3) libs/hbb_common/src/lib.rs
          p = "libs/hbb_common/src/lib.rs"
          t, crlf = read_text(p)
          t = sub(t, "pub mod udp;\n",
                     "pub mod udp;\n"
                     "#[cfg(feature = \"iroh-transport\")]\npub mod iroh_transport;\n"
                     "#[cfg(feature = \"iroh-transport\")]\npub mod crypto_handoff;\n"
                     "#[cfg(feature = \"iroh-transport\")]\npub mod iroh_upgrade;\n"
                     "#[cfg(feature = \"iroh-transport\")]\npub mod iroh_upgrade_session;\n"
                     "#[cfg(feature = \"iroh-transport\")]\npub mod iroh_transition;\n", p)
          write_text(p, t, crlf)

          # 4) build.py（与 patches/iroh-p1-code.patch 里的改动完全一致）
          p = "build.py"
          t, crlf = read_text(p)
          t = sub(t, "    parser.add_argument(\n        '--portable',",
                     "    parser.add_argument(\n        '--iroh',\n        action='store_true',\n"
                     "        help='Enable the experimental iroh(QUIC) peer-to-peer transport. '\n"
                     "             'Requires rustc >= 1.91 and an updated Cargo.lock.'\n    )\n"
                     "    parser.add_argument(\n        '--portable',", p)
          t = sub(t, "    if args.flutter:\n        features.append('flutter')\n",
                     "    if args.flutter:\n        features.append('flutter')\n"
                     "    if getattr(args, 'iroh', False):\n        features.append('iroh-transport')\n", p)
          write_text(p, t, crlf)

          # 5) 根包 Cargo.toml：转发 feature
          #    不加这一步 cargo 会直接报：
          #    error: the package 'rustdesk' does not contain this feature: iroh-transport
          #    （第一次跑就死在这里，属于接线遗漏，不是工具链问题）
          p = "Cargo.toml"
          t, crlf = read_text(p)
          t = sub(t, 'default = ["use_dasp"]\n',
                     'default = ["use_dasp"]\niroh-transport = ["hbb_common/iroh-transport"]\n', p)
          write_text(p, t, crlf)

          # 5) protos/message.proto：加 4 条升级消息 + 4 个 union 字段（33~36）
          #    这些消息走客户端之间的端到端通道，hbbs/hbbr 不解析，
          #    因此新增它们不需要改动服务器。
          p = "libs/hbb_common/protos/message.proto"
          t, crlf = read_text(p)
          msgs = pathlib.Path("nervdesk/message_proto_iroh.txt").read_text(encoding="utf-8")
          t = sub(t, "message Message {\n  oneof union {\n",
                     msgs + "message Message {\n  oneof union {\n", p)
          fields = ("    // NervDesk 扩展（33~36），见上面的说明\n"
                    "    IrohUpgradeOffer iroh_upgrade_offer = 33;\n"
                    "    IrohUpgradeAnswer iroh_upgrade_answer = 34;\n"
                    "    IrohUpgradeCommit iroh_upgrade_commit = 35;\n"
                    "    IrohUpgradeCommitAck iroh_upgrade_commit_ack = 36;\n")
          t = sub(t, "    TerminalResponse terminal_response = 32;\n  }\n}\n",
                     "    TerminalResponse terminal_response = 32;\n" + fields + "  }\n}\n", p)
          write_text(p, t, crlf)

          # 立刻校验
          cfg = pathlib.Path("libs/hbb_common/Cargo.toml").read_text(encoding="utf-8")
          lib = pathlib.Path("libs/hbb_common/src/lib.rs").read_text(encoding="utf-8")
          bp  = pathlib.Path("build.py").read_text(encoding="utf-8")
          assert 'iroh-transport = ["dep:iroh"]' in cfg, "Cargo.toml feature 未写入"
          assert 'iroh = { version = "1.2", optional = true }' in cfg, "Cargo.toml 依赖未写入"
          assert "pub mod iroh_transport;" in lib, "lib.rs 模块未注册"
          assert "'--iroh'" in bp, "build.py 开关未写入"
          assert "features.append('iroh-transport')" in bp, "build.py feature 未透传"
          assert pathlib.Path("libs/hbb_common/src/iroh_transport.rs").is_file(), "iroh_transport.rs 缺失"
          assert pathlib.Path("libs/hbb_common/src/crypto_handoff.rs").is_file(), "crypto_handoff.rs 缺失"
          assert "pub mod crypto_handoff;" in lib, "crypto_handoff 模块未注册"
          assert "pub mod iroh_upgrade;" in lib, "iroh_upgrade 模块未注册"
          assert "pub mod iroh_upgrade_session;" in lib, "iroh_upgrade_session 模块未注册"
          assert pathlib.Path("libs/hbb_common/src/iroh_upgrade_session.rs").is_file(), "iroh_upgrade_session.rs 缺失"
          assert pathlib.Path("libs/hbb_common/src/iroh_transition.rs").is_file(), "iroh_transition.rs 缺失"
          assert "pub mod iroh_transition;" in lib, "iroh_transition 模块未注册"
          proto = pathlib.Path("libs/hbb_common/protos/message.proto").read_text(encoding="utf-8")
          assert "IrohUpgradeOffer iroh_upgrade_offer = 33;" in proto, "proto union 字段未写入"
          assert "message IrohUpgradeCommitAck {}" in proto, "proto 消息未写入"
          assert pathlib.Path("libs/hbb_common/src/iroh_upgrade.rs").is_file(), "iroh_upgrade.rs 缺失"
          root_cfg = pathlib.Path("Cargo.toml").read_text(encoding="utf-8")
          assert 'iroh-transport = ["hbb_common/iroh-transport"]' in root_cfg, "根包 feature 未转发"
          print("=" * 60)
          print("iroh 源码改动已应用并通过校验")
          print("=" * 60)
          PYEOF

      # ======================================================================
      # 【M6-1 硬约束】io_loop/connection 接线补丁 —— 保留与自检
      # ----------------------------------------------------------------------
      # ⚠️ 历史教训：缺接线则 iroh 升级永不触发（真机日志全程无 iroh 活动，
      #    见 docs/03 相关记录；docs/02 §18；build/next-session-handoff.md §3）。
      #    旧分支是在分支源码里预先提交"已接线"的 io_loop.rs/connection.rs；
      #    本步骤把它固化成 workflow 内自证：先查标记；缺则 git apply 补丁；
      #    再查仍缺 = 立即失败，绝不带着"没接线"的产物往下走。
      # 标记：io_loop.rs 需含 drive_iroh_upgrade + start_iroh_upgrade +
      #       IROH_TICK_INTERVAL；connection.rs 需含 drive_iroh_upgrade +
      #       handle_iroh_upgrade + IROH_TICK_INTERVAL。
      # ======================================================================
      - name: Apply iroh wiring patches (io_loop/connection) — MUST
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          python3 - <<'PYEOF'
          import pathlib, subprocess, sys
          try:
              sys.stdout.reconfigure(encoding="utf-8", errors="replace")
              sys.stderr.reconfigure(encoding="utf-8", errors="replace")
          except Exception:
              pass

          def die(m):
              print("[FAIL] " + m, file=sys.stderr, flush=True); sys.exit(1)

          IO_LOOP = "src/client/io_loop.rs"
          CONN    = "src/server/connection.rs"
          CHECKS = {
              IO_LOOP: ["drive_iroh_upgrade", "start_iroh_upgrade", "IROH_TICK_INTERVAL"],
              CONN:    ["drive_iroh_upgrade", "handle_iroh_upgrade", "IROH_TICK_INTERVAL"],
          }

          def wired_ok():
              for path, markers in CHECKS.items():
                  p = pathlib.Path(path)
                  if not p.is_file():
                      return False
                  text = p.read_text(encoding="utf-8", errors="replace")
                  for m in markers:
                      if m not in text:
                          print("[INFO] %s 缺标记 %s" % (path, m), file=sys.stderr)
                          return False
              return True

          if wired_ok():
              print("[OK] io_loop/connection 接线已在源码树中（标记齐全），跳过 apply")
              sys.exit(0)

          print("[INFO] 检测到接线缺失，应用 wiring 补丁……")
          patches = ["patches/io_loop-iroh-hook.patch", "patches/connection-iroh-hook.patch"]
          for pf in patches:
              p = pathlib.Path(pf)
              if not p.is_file():
                  die("缺少接线补丁 %s；请随分支上传（该补丁缺失 = 无法保证 iroh 升级接线，拒绝构建）" % pf)
              r = subprocess.run(["git", "apply", "--check", pf], capture_output=True)
              if r.returncode != 0:
                  die("git apply --check 失败：%s\n%s" % (pf, r.stderr.decode("utf-8", "replace").strip()))
              subprocess.run(["git", "apply", pf], check=True)
              print("[OK] 已应用 %s" % pf)

          # 再查一次：仍缺 = 接线失败，立即失败（绝不静默继续）
          if not wired_ok():
              die("io_loop/connection 接线应用后标记仍缺失——iroh 升级将永不触发，"
                  "拒绝继续构建（历史教训，docs/02 §18）。请检查补丁版本与 1.4.9 基线是否匹配。")
          print("=" * 60)
          print("io_loop/connection 接线已确认（drive_iroh_upgrade / IROH_TICK_INTERVAL）")
          print("=" * 60)
          PYEOF

