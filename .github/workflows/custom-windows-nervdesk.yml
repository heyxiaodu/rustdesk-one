          [ -f patches/nervdesk-network-service/apply_nervdesk_network_service.py ] || { echo "::error::缺少 apply_nervdesk_network_service.py"; exit 1; }
          [ -f patches/nervdesk-branding-depth/apply_nervdesk_branding_depth.py ] || { echo "::error::缺少 apply_nervdesk_branding_depth.py"; exit 1; }

          # 2) 按序应用（脚本自带前置校验：t3 校验 t2 已应用，t4 校验品牌+t2+t3）
          python3 patches/nervdesk-features/apply_nervdesk_features.py
          python3 patches/nervdesk-network-service/apply_nervdesk_network_service.py
          python3 patches/nervdesk-branding-depth/apply_nervdesk_branding_depth.py

          # 3) 汇总锚点自检：三个模块的关键标记必须出现
