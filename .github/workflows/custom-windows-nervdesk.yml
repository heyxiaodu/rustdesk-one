          echo "============================================================"

      # ======================================================================
      # 【M6-2 密钥管线 · 占位符替换】把补丁/源码里的占位符换成 Secret 真值。
      #  - __NERVDESK_PASSWORD__   → $NERVDESK_PASSWORD（固定密码 + PIN）
      #  - __NERVDESK_RELAY_TOKEN__→ $NERVDESK_RELAY_TOKEN（relay 访问令牌）
      # 规则：
      #   1. 替换前在「编译作用域」（src/libs/flutter/res/build.py/Cargo.toml/
      #      nervdesk）里必须各命中 >= 1 处——0 命中 = t2/t3 补丁没装配，
      #      拒绝静默构建；
      #   2. 【F1 定向替换不变量】编译作用域内，占位符只允许出现在
      #      「const 初始化行」（pub const NERVDESK_BUILTIN_*: &str = "..."）或
      #      「注释行」——任何出现在其它代码行（如守卫右值）的命中都说明
      #      整树替换会破坏守卫语义（守卫自毁，t7 的 F1），立即失败；
      #      t9/t3 已把守卫右值改为运行时 marker() 拼接（format!("__{}_{}")），
      #      源文件里连续占位符只剩 const 初始化行与注释；
      #   3. 全树（除 .git/.github/target/build）做字节级替换，保留 CRLF；
      #   4. 替换后全树 0 残留，且 NERVDESK_BUILTIN_PASSWORD /
      #      NERVDESK_BUILTIN_RELAY_TOKEN 的 const 值必须等于对应 Secret
      #      （守卫语义词：真值 != marker 哨兵 → 出厂密码写入/令牌注入分支可达）。
      # 真值只在 runner 环境变量里流转：GitHub 会自动脱敏日志，本脚本
      # 不打印任何 Secret 内容（只打印替换计数）。
      # ======================================================================
      - name: Replace placeholder secrets (__NERVDESK_PASSWORD__ / __NERVDESK_RELAY_TOKEN__)
        shell: bash
        env:
          NERVDESK_PASSWORD: ${{ secrets.NERVDESK_PASSWORD }}
          NERVDESK_RELAY_TOKEN: ${{ secrets.NERVDESK_RELAY_TOKEN }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          python3 - <<'PYEOF'
          import os, pathlib, re, sys
          try:
              sys.stdout.reconfigure(encoding="utf-8", errors="replace")
              sys.stderr.reconfigure(encoding="utf-8", errors="replace")
          except Exception:
              pass

          def die(m):
              print("[FAIL] " + m, file=sys.stderr, flush=True); sys.exit(1)

          PW  = os.environ.get("NERVDESK_PASSWORD", "")
          TOK = os.environ.get("NERVDESK_RELAY_TOKEN", "")
          if not PW or not TOK:
              die("Secret 为空（Guard 步骤应已拦截）——拒绝用假值构建")

          PH_PW  = b"__NERVDESK_PASSWORD__"
          PH_TOK = b"__NERVDESK_RELAY_TOKEN__"
          IGNORE = {".git", ".github", "target", "build"}
          # 编译作用域：占位符必须真出现在会被编译进产物的源码里
          COMPILE_SCOPE = ["src", "libs", "flutter", "res", "build.py", "Cargo.toml", "nervdesk"]

          def walk(roots):
              files = []
              for root in roots:
                  rp = pathlib.Path(root)
                  if rp.is_file():
                      files.append(rp); continue
                  if not rp.is_dir():
                      continue
                  for p in rp.rglob("*"):
                      if p.is_file() and not any(part in IGNORE for part in p.parts):
                          files.append(p)
              return files

          def count_ph(files):
              c1 = c2 = 0
              for p in files:
                  try:
                      data = p.read_bytes()
                  except OSError:
                      continue
                  c1 += data.count(PH_PW); c2 += data.count(PH_TOK)
              return c1, c2

          # 【F1 定向替换不变量】占位符只允许出现在 const 初始化行或注释行；
          # 出现在其它代码行（守卫右值等）→ 整树替换将破坏守卫语义，拒绝构建。
          def invariant_violations(files):
              bad = []
              const_re = re.compile(
                  r'pub const NERVDESK_BUILTIN_(?:PASSWORD|RELAY_TOKEN): &str = "')
              for p in files:
                  try:
                      lines = p.read_text(encoding="utf-8", errors="replace").splitlines()
                  except OSError:
                      continue
                  for i, ln in enumerate(lines, 1):
                      if PH_PW.decode("latin1") in ln or PH_TOK.decode("latin1") in ln:
                          s = ln.lstrip()
                          if const_re.match(s) or s.startswith(("//", "/*", "*")):
                              continue
                          bad.append("%s:%d: %s" % (p, i, ln.strip()[:100]))
              return bad

          n_pw, n_tok = count_ph(walk(COMPILE_SCOPE))
          if n_pw == 0 or n_tok == 0:
              die("编译作用域占位符缺失（password=%d, relay_token=%d）：t2/t3 补丁未装配或未含占位符，拒绝静默构建" % (n_pw, n_tok))

          bad = invariant_violations(walk(COMPILE_SCOPE))
          if bad:
              die("F1 定向替换不变量被破坏——占位符出现在非 const 初始化/非注释行，"
                  "整树替换会导致守卫自毁（t7 F1）。违规行：\n  " + "\n  ".join(bad))

          rp_pw = rt_tok = 0
          for p in walk(["."]):
              try:
                  data = p.read_bytes()
              except OSError:
                  continue
              c1 = data.count(PH_PW); c2 = data.count(PH_TOK)
              if c1 or c2:
                  data = data.replace(PH_PW, PW.encode()).replace(PH_TOK, TOK.encode())
                  p.write_bytes(data)
                  rp_pw += c1; rt_tok += c2

          left_pw, left_tok = count_ph(walk(["."]))
          if left_pw or left_tok:
              die("替换后仍有占位符残留（password=%d, relay_token=%d）" % (left_pw, left_tok))

          # 替换后守卫语义词：const 值必须等于 Secret（真值 != marker 哨兵 → 分支可达）
          const_pw = const_tok = None
          for p in walk(COMPILE_SCOPE):
              try:
                  text = p.read_text(encoding="utf-8", errors="replace")
              except OSError:
                  continue
              m1 = re.search(r'pub const NERVDESK_BUILTIN_PASSWORD: &str = "([^"]*)"', text)
              m2 = re.search(r'pub const NERVDESK_BUILTIN_RELAY_TOKEN: &str = "([^"]*)"', text)
              if m1 and m1.group(1) != "__NERVDESK_PASSWORD__":
                  const_pw = m1.group(1)
              if m2 and m2.group(1) != "__NERVDESK_RELAY_TOKEN__":
                  const_tok = m2.group(1)
          if const_pw != PW:
              die("NERVDESK_BUILTIN_PASSWORD const 值 != Secret（guard 语义失效：出厂密码写入分支不可达）")
          if const_tok != TOK:
              die("NERVDESK_BUILTIN_RELAY_TOKEN const 值 != Secret（guard 语义失效：令牌注入分支不可达）")

          print("=" * 60)
          print("[OK] 占位符替换完成：__NERVDESK_PASSWORD__ x%d → Secret；__NERVDESK_RELAY_TOKEN__ x%d → Secret" % (rp_pw, rt_tok))
          print("（真值仅存在于 runner 工作区，不回写仓库、不打印内容）")
          print("=" * 60)
          PYEOF

      - name: Inject custom server configuration
        shell: bash
        # Windows 上的 Python 默认用 cp1252 编码输出，打印中文会直接
        # UnicodeEncodeError 崩掉（第一次跑就是死在这里，与补丁逻辑无关）。
        # 这里强制 UTF-8，避免这种与业务无关的失败。
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          python3 - <<'PYEOF'
          import os, pathlib, re, sys

          try:
              sys.stdout.reconfigure(encoding="utf-8", errors="replace")
              sys.stderr.reconfigure(encoding="utf-8", errors="replace")
          except Exception:
              pass

          ID    = os.environ["RS_ID_SERVER"].strip()
          API   = os.environ["RS_API_SERVER"].strip()
          KEY   = os.environ["RS_KEY"].strip()
          RELAY = os.environ["RS_RELAY_SERVER"].strip()

          def die(m):
              print("[FAIL] " + m, file=sys.stderr, flush=True)
              sys.exit(1)

          # 统一按 LF 处理、写完再还原原有行尾，
          # 这样 checkout 出来不论 LF 还是 CRLF 都不会踩到「锚点匹配 0 处」。
          def read_text(p):
              raw = p.read_bytes().decode("utf-8")
              crlf = "\r\n" in raw
              return (raw.replace("\r\n", "\n") if crlf else raw), crlf

          def write_text(p, text, crlf):
              p.write_bytes((text.replace("\n", "\r\n") if crlf else text).encode("utf-8"))

          cfg_p = pathlib.Path("libs/hbb_common/src/config.rs")
          if not cfg_p.is_file():
              die("找不到 %s ，子模块可能没拉下来" % cfg_p)

          cfg, cfg_crlf = read_text(cfg_p)
          # 1) ID 服务器：RENDEZVOUS_SERVERS（锚点已验证有效，勿动）
          cfg, n1 = re.subn(r'pub const RENDEZVOUS_SERVERS: &\[&str\] = &\[[^\]]*\];',
                            'pub const RENDEZVOUS_SERVERS: &[&str] = &["%s"];' % ID, cfg)
          if n1 != 1:
              die("RENDEZVOUS_SERVERS 锚点匹配 %d 处，期望 1 处" % n1)
          # 2) 公钥：RS_PUB_KEY（锚点已验证有效，勿动）
          cfg, n2 = re.subn(r'pub const RS_PUB_KEY: &str = "[^"]*";',
                            'pub const RS_PUB_KEY: &str = "%s";' % KEY, cfg)
          if n2 != 1:
              die("RS_PUB_KEY 锚点匹配 %d 处，期望 1 处" % n2)
          # 3) 【t16 修复】t3 参数化 const 单行锚点（匹配数 != 1 即失败）：
          #    NERVDESK_RELAY_SERVER ← RS_RELAY_SERVER
          cfg, n3 = re.subn(r'pub const NERVDESK_RELAY_SERVER: &str = "[^"]*";',
                            'pub const NERVDESK_RELAY_SERVER: &str = "%s";' % RELAY, cfg)
          if n3 != 1:
              die("NERVDESK_RELAY_SERVER 锚点匹配 %d 处，期望 1 处" % n3)
          #    NERVDESK_API_SERVER ← RS_API_SERVER
          cfg, n4 = re.subn(r'pub const NERVDESK_API_SERVER: &str = "[^"]*";',
                            'pub const NERVDESK_API_SERVER: &str = "%s";' % API, cfg)
          if n4 != 1:
              die("NERVDESK_API_SERVER 锚点匹配 %d 处，期望 1 处" % n4)
          write_text(cfg_p, cfg, cfg_crlf)

          # 立刻校验，确保真的写进去了（全部在 config.rs 参数化 const；
          # t3 后 common.rs 读取层已接 NERVDESK_API_SERVER，不再注入 common.rs）
          cfg = cfg_p.read_text(encoding="utf-8")
          assert ('&["%s"];' % ID) in cfg, "RENDEZVOUS_SERVERS 写入失败"
          assert ('"%s";' % KEY) in cfg, "RS_PUB_KEY 写入失败"
          assert ('NERVDESK_RELAY_SERVER: &str = "%s";' % RELAY) in cfg, "NERVDESK_RELAY_SERVER 写入失败"
          assert ('NERVDESK_API_SERVER: &str = "%s";' % API) in cfg, "NERVDESK_API_SERVER 写入失败"
          # 校验公共地址残留：rs-ny 是官方 ID 服务器；t3 后 common.rs 的旧 API
          # 注入锚点（admin.rustdesk.com + .to_owned() 拼接形式）应已不存在
          # （common.rs 测试夹具里另有 admin.rustdesk.com 属合法，保留）。
          # 旧锚点字面量刻意拆分（与 F1 哨兵同思路），避免自匹配静态自查。
          assert "rs-ny.rustdesk.com" not in cfg, "仍残留官方公共服务器地址"
          com = pathlib.Path("src/common.rs")
          old_api_anchor = '"https://admin.rustdesk.com"' + '.to_owned()'
          if com.is_file() and old_api_anchor in com.read_text(encoding="utf-8"):
              die("src/common.rs 仍残留旧 API 注入锚点（t3 已参数化为 NERVDESK_API_SERVER const）——补丁未装配？")

          print("=" * 60)
          print("已写入源码（config.rs 参数化 const）：")
          print("  ID  服务器 : %s:21116" % ID)
          print("  中继服务器 : %s" % RELAY)
          print("  API 服务器 : %s" % API)
          print("  公钥       : %s...%s" % (KEY[:8], KEY[-6:]))
          print("=" * 60)
          PYEOF

      - name: Show patched lines
        shell: bash
        run: |
          grep -n "RENDEZVOUS_SERVERS\|RS_PUB_KEY" libs/hbb_common/src/config.rs | head -5
          grep -n "NERVDESK_RELAY_SERVER\|NERVDESK_API_SERVER" libs/hbb_common/src/config.rs | head -5
          # 接线标记复核（M6-1）：两个文件都必须出现升级驱动
          echo "--- wiring markers ---"
          grep -c "drive_iroh_upgrade" src/client/io_loop.rs src/server/connection.rs
          grep -c "IROH_TICK_INTERVAL" src/client/io_loop.rs src/server/connection.rs

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        id: flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          [[ "3.24.5" == ${{ env.FLUTTER_VERSION }} ]] && git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - name: Report actual rustc version
        shell: bash
        run: |
          echo "=== 这是本次验证的关键：必须是 1.91 或更高 ==="
          rustc --version
          cargo --version

      # 【F-V2 修复】rust-cache 必须按变体隔离：option_env!("NERVDESK_MODE")
      # 不参与 cargo 指纹，若两腿共用同一缓存键，某一腿的缓存可能被另一腿
      # 复用 → 把上一腿的编译期形态静默带进本腿产物。
      # 隔离机制双保险：
      #   1) prefix-key 直接含 matrix.mode（两腿缓存键必然不同）；
      #   2) env-vars: NERVDESK_MODE（取值进入缓存键 hash，模式值变化即换键）。
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        env:
          NERVDESK_MODE: ${{ matrix.mode }}
        with:
          prefix-key: windows-2022-custom-${{ matrix.mode }}
          env-vars: NERVDESK_MODE

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-x64-windows-static-rel-out.log" || true
        shell: bash

      - name: Complete Cargo.lock for the --locked build
        shell: bash
        run: |
          # build.py 里所有 cargo 调用都带 --locked，开启 iroh 后必须先补全 lockfile。
          # 实测 cargo 的更新是纯增量的（既有依赖版本一个都不变），
          # 所以这里只补新增依赖，不会顺带升级任何东西。
          cargo fetch
          echo "Cargo.lock 中 iroh 相关条目数: $(grep -c '^name = "iroh' Cargo.lock)"

      # ======================================================================
      # 端到端验证 iroh 传输本身（真实连接，不是假流）
      # ----------------------------------------------------------------------
      # 这个测试建立两个**真实的 iroh endpoint**，互相投递真实的 protobuf 字节，
      # 跑完 Offer → Answer → 拨号 → Commit → CommitAck → 换流，
      # 最后确认数据真的从 QUIC 通道过去了。
      #
      # 为什么放在主构建**之前**：它一上线就挖出过一个会让整条连接僵死的缺陷
      # （iroh 的 accept_bi() 要等对端真的发了数据才返回，而我们拨号后
      # 要等 CommitAck 才发数据 → 死锁）。传输层有问题就该在这里立刻失败，
      # 不必先花 40 分钟编 Flutter 再发现。
      #
      # 注意：它跑的是 loopback 直连，**不经过 hbbs 信令、也没有真实网络路径**，
      # 所以它不能替代两台真机的实测 —— 但它能证明"协议逻辑 + iroh 连接"
      # 这一整段是通的。
      # ======================================================================
      - name: Run iroh transport end-to-end test
        shell: bash
        run: |
          mkdir -p libs/hbb_common/tests
          cp nervdesk/iroh_upgrade_e2e.rs libs/hbb_common/tests/
          # 单线程跑：每个用例都要绑本地端口建 endpoint，串行更稳
          cargo test --locked -p hbb_common --features iroh-transport \
            --test iroh_upgrade_e2e -- --test-threads=1

      # ======================================================================
      # 【t12 变体 · Flutter dart-define 通道】NERVDESK_MODE 必须同时进入
      # Rust 侧（option_env! ← Build 步骤 env，见下）与 Flutter 侧
      # （String.fromEnvironment ← --dart-define）。build.py 的
      # 'flutter build windows --release' 没有透传参数，这里用锚点精确追加
      # dart-define（锚点 != 1 处立即失败）。两通道缺一不可：
      # 只传 env 则 UI 层仍是默认形态（Rust 逻辑与 Flutter UI 不一致）。
      # ======================================================================
      - name: Wire NERVDESK_MODE into flutter build (dart-define channel)
        shell: bash
        env:
          NERVDESK_MODE: ${{ matrix.mode }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          python3 - <<'PYEOF'
          import os, pathlib, sys
          try:
              sys.stdout.reconfigure(encoding="utf-8", errors="replace")
              sys.stderr.reconfigure(encoding="utf-8", errors="replace")
          except Exception:
              pass
          mode = os.environ["NERVDESK_MODE"]
          if mode not in ("controlled", "controller"):
              print("[FAIL] NERVDESK_MODE 非法：" + mode, file=sys.stderr); sys.exit(1)
          p = pathlib.Path("build.py")
          raw = p.read_bytes()
          crlf = b"\r\n" in raw
          text = raw.replace(b"\r\n", b"\n").decode("utf-8")
          anchor = "    system2('flutter build windows --release')\n"
          n = text.count(anchor)
          if n != 1:
              print("[FAIL] build.py flutter windows 锚点匹配 %d 处，期望 1 处" % n, file=sys.stderr); sys.exit(1)
          new = "    system2('flutter build windows --release --dart-define=NERVDESK_MODE=%s')\n" % mode
          out = text.replace(anchor, new)
          p.write_bytes(out.replace("\n", "\r\n").encode("utf-8") if crlf else out.encode("utf-8"))
          assert ("--dart-define=NERVDESK_MODE=%s" % mode) in p.read_text(encoding="utf-8"), "dart-define 未写入 build.py"
          print("=" * 60)
          print("[OK] build.py 已注入 --dart-define=NERVDESK_MODE=%s" % mode)
          print("=" * 60)
          PYEOF

      # 【t12 变体 · Rust 通道】NERVDESK_MODE 环境变量随 cargo/rustc 编译进程
      # 可见——option_env!("NERVDESK_MODE") 在编译期把形态固化进产物。
      - name: Build rustdesk (${{ matrix.mode }})
        env:
          NERVDESK_MODE: ${{ matrix.mode }}
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram --iroh
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums

            $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1\.4\.zip$').Matches.Groups[1].Value
            $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
            $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
            $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
            if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums match, extract the file."
                Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
                mkdir ./rustdesk/drivers
                mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
                Expand-Archive printer_driver_adapter.zip -DestinationPath .
                mv -Force .\printer_driver_adapter.dll ./rustdesk
            } elseif ($checksum_driver -ne $downloadsum_driver.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums do not match, ignore the file."
            } else {
                Write-Output "printer_driver_adapter.dll, checksums do not match, ignore the file."
            }
          } catch {
              Write-Host "Ingore the printer driver error."
          }

      # ======================================================================
      # 【M6-3 占位符自测钩子 · 第一道】构建产物（rustdesk 完整程序目录）
      # 字节级扫描 "__NERVDESK_" 前缀占位符原样；命中立即失败——
      # 防止"占位符没替换还静默打包发布"。
      # ======================================================================
      - name: Placeholder self-test (build dir must not contain __NERVDESK_)
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import pathlib, sys
          try:
              sys.stdout.reconfigure(encoding="utf-8", errors="replace")
          except Exception:
              pass
          PREFIX = b"__NERVDESK_"
          root = pathlib.Path("rustdesk")
          if not root.is_dir():
              print("[FAIL] 找不到产物目录 rustdesk/", file=sys.stderr); sys.exit(1)
          hits = []
          for f in root.rglob("*"):
              if not f.is_file():
                  continue
              try:
                  data = f.read_bytes()
              except OSError:
                  continue
              if PREFIX in data:
                  hits.append(str(f))
          if hits:
              print("[FAIL] 构建产物含占位符原样（%d 个文件），拒绝进入打包：" % len(hits), file=sys.stderr)
              for h in hits:
                  print("  " + h, file=sys.stderr)
              sys.exit(1)
          print("[OK] rustdesk/ 产物目录无占位符残留（%d 个文件已扫描）" % len(list(root.rglob("*"))))
          PYEOF

      - name: Verify built DLL contains our server config
        shell: bash
        continue-on-error: true
        run: |
          python3 - <<'PYEOF'
          import os
          data = open(r"rustdesk/librustdesk.dll", "rb").read()
          for s in (os.environ["RS_ID_SERVER"], os.environ["RS_API_SERVER"]):
              print(("  FOUND   " if s.encode() in data else "  MISSING ") + s)
          PYEOF

      - name: find Runner.res
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" == "" ]; then
            echo "Runner.res: not found";
          else
            echo "Runner.res: $runner_res";
            cp $runner_res ./libs/portable/Runner.res;
            ls -l ./libs/portable/Runner.res;
          fi

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      - name: Upload unsigned app directory (${{ matrix.mode }})
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nervdesk-${{ matrix.mode }}-windows-x64-unsigned
          path: rustdesk

      # 产物命名（M3-1 / t4 §1.3 + t12 双变体）：BINARY_NAME 已改为 nervdesk，
      # 便携打包输入 nervdesk.exe；SignOutput 产物按变体命名
      # nervdesk-{mode}-VERSION-x86_64.{exe,msi}（Release 由 publish-release job 统一发布）。
      - name: Build self-extracted executable (${{ matrix.mode }})
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/nervdesk.exe
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/nervdesk-${{ matrix.mode }}-${{ env.VERSION }}-x86_64.exe

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      # MSI 品牌参数（A 档 + t4）：--app-name/--manufacturer 按 NervDesk 传参。
      - name: Build msi (${{ matrix.mode }})
        run: |
          pushd ./res/msi
          python preprocess.py --arp --app-name NervDesk --manufacturer NervDesk -d ../../rustdesk
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          mv $msi.FullName ../../SignOutput/nervdesk-${{ matrix.mode }}-${{ env.VERSION }}-x86_64.msi
          sha256sum ../../SignOutput/nervdesk-${{ matrix.mode }}-*.msi

      # ======================================================================
      # 【M6-3 占位符自测钩子 · 终检】SignOutput（exe/msi）+ rustdesk/ 目录
      # 再次字节级扫描。exe/msi 内部载荷可能被压缩，正文以 rustdesk/ 目录
      # 的扫描为准（打包内容源于该目录）；这里兜住直接写进打包头的场景。
      # ======================================================================
      - name: "Placeholder self-test (final: SignOutput + build dir)"
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import pathlib, sys
          try:
              sys.stdout.reconfigure(encoding="utf-8", errors="replace")
          except Exception:
              pass
          PREFIX = b"__NERVDESK_"
          targets = ["rustdesk", "SignOutput"]
          hits = []
          scanned = 0
          for t in targets:
              p = pathlib.Path(t)
              if not p.exists():
                  continue
              files = [p] if p.is_file() else [f for f in p.rglob("*") if f.is_file()]
              for f in files:
                  scanned += 1
                  try:
                      data = f.read_bytes()
                  except OSError:
                      continue
                  if PREFIX in data:
                      hits.append(str(f))
          if hits:
              print("[FAIL] 打包产物含占位符原样（%d 个文件）：" % len(hits), file=sys.stderr)
              for h in hits:
                  print("  " + h, file=sys.stderr)
              sys.exit(1)
          print("[OK] 终检通过：%s 共 %d 个文件无占位符残留" % (" + ".join(t for t in targets if pathlib.Path(t).exists()), scanned))
          PYEOF

      # 【t12 双变体】每个变体把 SignOutput（exe+msi）上传为 workflow artifact；
      # 统一 Release（同一 TAG 下两个产物集）由 publish-release job 完成，
      # 避免两个矩阵腿并发抢建同一 tag（softprops 同 tag 二次创建会失败）。
      - name: Upload release artifacts (${{ matrix.mode }})
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nervdesk-${{ matrix.mode }}-windows-x64-release
          path: |
            ./SignOutput/*.exe
            ./SignOutput/*.msi

  # ======================================================================
  # 【t12 双变体 · Release】同一 TAG（默认 nervdesk-custom-1.4.9-r12）下发布
  # controlled + controller 两套产物（各自 exe + msi）。
  # 只在该 job 判定需要：[build-windows-x64] 矩阵两腿全部成功后执行；
  # 任一腿失败 → 本 job 自动跳过，不发布残缺产物集。
  # ======================================================================
  publish-release:
    name: Publish Release (controlled + controller)
    needs: [build-windows-x64]
    runs-on: ubuntu-latest
    steps:
      - name: Download controlled release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nervdesk-controlled-windows-x64-release
          path: ./controlled

      - name: Download controller release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nervdesk-controller-windows-x64-release
          path: ./controller

      - name: Verify both variant artifacts present
        shell: bash
        run: |
          ls -l ./controlled ./controller
          n_ctrl=$(ls ./controlled/nervdesk-controlled-*.exe ./controlled/nervdesk-controlled-*.msi 2>/dev/null | wc -l)
          n_ctr=$(ls ./controller/nervdesk-controller-*.exe ./controller/nervdesk-controller-*.msi 2>/dev/null | wc -l)
          [ "$n_ctrl" -ge 2 ] || { echo "::error::controlled 产物缺失（找到 $n_ctrl / 需 exe+msi）"; exit 1; }
          [ "$n_ctr" -ge 2 ]  || { echo "::error::controller 产物缺失（找到 $n_ctr / 需 exe+msi）"; exit 1; }
          sha256sum ./controlled/* ./controller/*

      - name: Publish Release (dual variant)
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          prerelease: true
          tag_name: ${{ env.TAG_NAME }}
          files: |
            ./controlled/nervdesk-controlled-*.exe
            ./controlled/nervdesk-controlled-*.msi
            ./controller/nervdesk-controller-*.exe
            ./controller/nervdesk-controller-*.msi