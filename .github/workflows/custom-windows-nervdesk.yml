      # 目录/脚本缺失 = 立即失败，绝不"静默构建一个没有 NervDesk 行为的产品"。
      # 应用顺序与脚本自带的前置校验（t3 校验 t2、t4 校验品牌+t2+t3）由
      # t2/t3/t4 契约固定——本例强制固定顺序，脚本自身也会再次校验。
      # ======================================================================
      - name: Apply NervDesk patches via anchor-check scripts (t2→t3→t4)
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          set -euo pipefail
          # 1) 前置存在性：三个补丁目录、.patch 与 apply 脚本缺一不可
          for d in \
            patches/nervdesk-features \
