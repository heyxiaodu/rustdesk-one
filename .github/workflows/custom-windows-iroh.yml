# ############################################################################
#  【实验性】iroh/QUIC 传输版 —— 用于验证工具链与传输层，不是日常使用版本
# ############################################################################
#  与 custom-windows-build.yml 的区别只有 4 点：
#    1. Rust 工具链从 1.75 抬到 1.91（iroh 1.x 的 MSRV；1.75 是官方为 sciter 锁的）
#    2. 源码里额外包含 iroh 传输模块（libs/hbb_common/src/iroh_transport.rs 等 4 个文件）
#    3. 构建前多跑一次 `cargo fetch`，因为 build.py 全程用 --locked，
#       开启 iroh 后 Cargo.lock 必须先补全（实测是纯增量更新）
#    4. build.py 多传一个 --iroh
#
#  ⚠️ 即使构建成功，当前版本也还**没有接通信令**（P2 未做），
#     所以 iroh 通道暂时不会被实际使用。这次构建的主要目的是回答
#     「rustc 1.91 能不能编过整个 RustDesk」这个未知数。
# ############################################################################

# ============================================================================
#  自编译 RustDesk Windows 客户端（内置你自己的服务器）
# ============================================================================
#  怎么用（详细图文步骤见 docs/01-零基础操作手册.md）：
#    1. 在 GitHub 上 fork rustdesk/rustdesk
#    2. 在你的 fork 里，从 1.4.9 这个 tag 新建一个分支，名字用 nervdesk-1.4.9
#       （必须基于 1.4.9，因为下面的 VERSION / FLUTTER_VERSION 是按 1.4.9 固定的）
#    3. 把本文件上传到该分支的 .github/workflows/custom-windows-build.yml
#       上传这个动作本身就是一次 push，会自动开始编译
#
#  产物：仓库 Releases 页面里的两个文件
#        rustdesk-1.4.9-x86_64.exe   <- 免安装便携版（推荐先试这个）
#        rustdesk-1.4.9-x86_64.msi   <- 安装版
#        另外该次运行页面的 Artifacts 里还能下到未打包的完整程序目录。
#
#  换服务器 / 换 Key：只改下面 env: 里的 4 行，其它都不用动。
# ============================================================================

name: Build Custom RustDesk + iroh (Windows x64)

on:
  # 手动触发（仓库默认分支上出现这个 workflow 后，Actions 页面会多一个 Run workflow 按钮）
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布标签（同一标签只能成功一次，重跑请换个名字）'
        required: true
        default: 'custom-iroh-1.4.9'
  # 推送到 nervdesk- 开头的分支时自动构建。
  # 这样「上传本文件」这个动作本身就会直接开始编译，不用再点按钮。
  push:
    branches:
      - 'nervdesk-iroh-**'

# 发布 Release 需要写权限
permissions:
  contents: write

env:
  # ---------------- 你的服务器信息：只改这一段 ----------------
  RS_ID_SERVER: "id.nervcode.eu.org"
  RS_RELAY_SERVER: "relay.nervcode.eu.org:21117"
  RS_API_SERVER: "https://api.nervcode.eu.org"
  RS_KEY: "HJtH5YUqy6Dz8FHfypUKPJSGoxbBeSgtDsahkT6MBo4="
  # -----------------------------------------------------------

  # 以下与官方 CI 保持一致，一般不要动
  VERSION: "1.4.9"
  FLUTTER_VERSION: "3.24.5"
  LLVM_VERSION: "15.0.6"
  SCITER_RUST_VERSION: "1.91"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  TAG_NAME: ${{ github.event.inputs.release_tag || 'custom-iroh-1.4.9' }}
  UPLOAD_ARTIFACT: "true"
  # 固定成 "-2"：官方 CI 用这个值判断"跳过需要 RustDesk 私钥的代码签名"。
  # 我们没有他们的签名服务，跳过是对的（代价是首次运行会有 SmartScreen 提示）。
  SIGN_BASE_URL: "-2"

jobs:
  # 生成 flutter_rust_bridge 胶水代码（官方必需步骤）
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  # 编译任务栏窗口辅助程序（官方必需步骤）
  build-topmost-window:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-windows-x64:
    name: Windows x64
    needs: [generate-bridge, build-topmost-window]
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      # ======================================================================
      # 关键步骤：在这里把你的服务器信息写进源码
      # 改动 3 处，编译前进不来就立刻报错，不会白等 1 小时才发现
      # ======================================================================
      # libs/hbb_common 是 git 子模块：GitHub 的 Contents API 无法直接往里写文件
      # （会返回 409/404），而且 Windows 上 git apply 容易因 CRLF 失配。
      # 所以模块模板放在 nervdesk/ 下，这里在构建前把它落到源码树里。
      - name: Apply iroh source changes
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          python3 - <<'PYEOF'
          import pathlib, shutil, sys
          try:
              sys.stdout.reconfigure(encoding="utf-8", errors="replace")
              sys.stderr.reconfigure(encoding="utf-8", errors="replace")
          except Exception:
              pass

          def die(m):
              print("[FAIL] " + m, file=sys.stderr, flush=True); sys.exit(1)

          def read_text(p):
              raw = pathlib.Path(p).read_bytes().decode("utf-8")
              crlf = "\r\n" in raw
              return (raw.replace("\r\n", "\n") if crlf else raw), crlf

          def write_text(p, text, crlf):
              pathlib.Path(p).write_bytes((text.replace("\n", "\r\n") if crlf else text).encode("utf-8"))

          def sub(text, old, new, label):
              n = text.count(old)
              if n != 1: die("%s: 锚点匹配 %d 处，期望 1 处" % (label, n))
              return text.replace(old, new)

          # 1) 新增两个模块：iroh 传输 + 传输切换时的加密状态迁移
          mods = ["iroh_transport.rs", "crypto_handoff.rs", "iroh_upgrade.rs", "iroh_upgrade_session.rs"]
          dst_dir = pathlib.Path("libs/hbb_common/src")
          if not dst_dir.is_dir(): die("子模块 libs/hbb_common 没拉下来")
          for name in mods:
              src = pathlib.Path("nervdesk") / name
              if not src.is_file(): die("缺少 nervdesk/%s" % name)
              shutil.copyfile(src, dst_dir / name)

          # 2) libs/hbb_common/Cargo.toml
          p = "libs/hbb_common/Cargo.toml"
          t, crlf = read_text(p)
          t = sub(t, 'webrtc = ["dep:webrtc"]\n',
                     'webrtc = ["dep:webrtc"]\n'
                     '# 用 iroh(QUIC) 承载点对点数据通道，默认关闭。\n'
                     '# 开启后可用 `cargo check -p hbb_common --features iroh-transport` 验证。\n'
                     '#\n'
                     '# 注意：iroh 1.2 的 MSRV 是 rustc 1.91，而 RustDesk 的 CI 锁定 1.75\n'
                     '# （1.75 是为了 sciter 旧 UI）。启用本 feature 必须同时抬高工具链版本。\n'
                     'iroh-transport = ["dep:iroh"]\n', p)
          t = sub(t, 'libloading = "0.8"\n',
                     'libloading = "0.8"\n'
                     '# QUIC 传输（可选，见 feature iroh-transport）。锁死小版本，避免 API 漂移。\n'
                     'iroh = { version = "1.2", optional = true }\n', p)
          write_text(p, t, crlf)

          # 3) libs/hbb_common/src/lib.rs
          p = "libs/hbb_common/src/lib.rs"
          t, crlf = read_text(p)
          t = sub(t, "pub mod udp;\n",
                     "pub mod udp;\n"
                     "#[cfg(feature = \"iroh-transport\")]\npub mod iroh_transport;\n"
                     "#[cfg(feature = \"iroh-transport\")]\npub mod crypto_handoff;\n"
                     "#[cfg(feature = \"iroh-transport\")]\npub mod iroh_upgrade;\n"
                     "#[cfg(feature = \"iroh-transport\")]\npub mod iroh_upgrade_session;\n", p)
          write_text(p, t, crlf)

          # 4) build.py（与 patches/iroh-p1-code.patch 里的改动完全一致）
          p = "build.py"
          t, crlf = read_text(p)
          t = sub(t, "    parser.add_argument(\n        '--portable',",
                     "    parser.add_argument(\n        '--iroh',\n        action='store_true',\n"
                     "        help='Enable the experimental iroh(QUIC) peer-to-peer transport. '\n"
                     "             'Requires rustc >= 1.91 and an updated Cargo.lock.'\n    )\n"
                     "    parser.add_argument(\n        '--portable',", p)
          t = sub(t, "    if args.flutter:\n        features.append('flutter')\n",
                     "    if args.flutter:\n        features.append('flutter')\n"
                     "    if getattr(args, 'iroh', False):\n        features.append('iroh-transport')\n", p)
          write_text(p, t, crlf)

          # 5) 根包 Cargo.toml：转发 feature
          #    不加这一步 cargo 会直接报：
          #    error: the package 'rustdesk' does not contain this feature: iroh-transport
          #    （第一次跑就死在这里，属于接线遗漏，不是工具链问题）
          p = "Cargo.toml"
          t, crlf = read_text(p)
          t = sub(t, 'default = ["use_dasp"]\n',
                     'default = ["use_dasp"]\niroh-transport = ["hbb_common/iroh-transport"]\n', p)
          write_text(p, t, crlf)

          # 5) protos/message.proto：加 4 条升级消息 + 4 个 union 字段（33~36）
          #    这些消息走客户端之间的端到端通道，hbbs/hbbr 不解析，
          #    因此新增它们不需要改动服务器。
          p = "libs/hbb_common/protos/message.proto"
          t, crlf = read_text(p)
          msgs = pathlib.Path("nervdesk/message_proto_iroh.txt").read_text(encoding="utf-8")
          t = sub(t, "message Message {\n  oneof union {\n",
                     msgs + "message Message {\n  oneof union {\n", p)
          fields = ("    // NervDesk 扩展（33~36），见上面的说明\n"
                    "    IrohUpgradeOffer iroh_upgrade_offer = 33;\n"
                    "    IrohUpgradeAnswer iroh_upgrade_answer = 34;\n"
                    "    IrohUpgradeCommit iroh_upgrade_commit = 35;\n"
                    "    IrohUpgradeCommitAck iroh_upgrade_commit_ack = 36;\n")
          t = sub(t, "    TerminalResponse terminal_response = 32;\n  }\n}\n",
                     "    TerminalResponse terminal_response = 32;\n" + fields + "  }\n}\n", p)
          write_text(p, t, crlf)

          # 立刻校验
          cfg = pathlib.Path("libs/hbb_common/Cargo.toml").read_text(encoding="utf-8")
          lib = pathlib.Path("libs/hbb_common/src/lib.rs").read_text(encoding="utf-8")
          bp  = pathlib.Path("build.py").read_text(encoding="utf-8")
          assert 'iroh-transport = ["dep:iroh"]' in cfg, "Cargo.toml feature 未写入"
          assert 'iroh = { version = "1.2", optional = true }' in cfg, "Cargo.toml 依赖未写入"
          assert "pub mod iroh_transport;" in lib, "lib.rs 模块未注册"
          assert "'--iroh'" in bp, "build.py 开关未写入"
          assert "features.append('iroh-transport')" in bp, "build.py feature 未透传"
          assert pathlib.Path("libs/hbb_common/src/iroh_transport.rs").is_file(), "iroh_transport.rs 缺失"
          assert pathlib.Path("libs/hbb_common/src/crypto_handoff.rs").is_file(), "crypto_handoff.rs 缺失"
          assert "pub mod crypto_handoff;" in lib, "crypto_handoff 模块未注册"
          assert "pub mod iroh_upgrade;" in lib, "iroh_upgrade 模块未注册"
          assert "pub mod iroh_upgrade_session;" in lib, "iroh_upgrade_session 模块未注册"
          assert pathlib.Path("libs/hbb_common/src/iroh_upgrade_session.rs").is_file(), "iroh_upgrade_session.rs 缺失"
          proto = pathlib.Path("libs/hbb_common/protos/message.proto").read_text(encoding="utf-8")
          assert "IrohUpgradeOffer iroh_upgrade_offer = 33;" in proto, "proto union 字段未写入"
          assert "message IrohUpgradeCommitAck {}" in proto, "proto 消息未写入"
          assert pathlib.Path("libs/hbb_common/src/iroh_upgrade.rs").is_file(), "iroh_upgrade.rs 缺失"
          root_cfg = pathlib.Path("Cargo.toml").read_text(encoding="utf-8")
          assert 'iroh-transport = ["hbb_common/iroh-transport"]' in root_cfg, "根包 feature 未转发"
          print("=" * 60)
          print("iroh 源码改动已应用并通过校验")
          print("=" * 60)
          PYEOF

      - name: Inject custom server configuration
        shell: bash
        # Windows 上的 Python 默认用 cp1252 编码输出，打印中文会直接
        # UnicodeEncodeError 崩掉（第一次跑就是死在这里，与补丁逻辑无关）。
        # 这里强制 UTF-8，避免这种与业务无关的失败。
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          python3 - <<'PYEOF'
          import os, pathlib, re, sys

          try:
              sys.stdout.reconfigure(encoding="utf-8", errors="replace")
              sys.stderr.reconfigure(encoding="utf-8", errors="replace")
          except Exception:
              pass

          ID    = os.environ["RS_ID_SERVER"].strip()
          API   = os.environ["RS_API_SERVER"].strip()
          KEY   = os.environ["RS_KEY"].strip()
          RELAY = os.environ["RS_RELAY_SERVER"].strip()

          def die(m):
              print("[FAIL] " + m, file=sys.stderr, flush=True)
              sys.exit(1)

          # 统一按 LF 处理、写完再还原原有行尾，
          # 这样 checkout 出来不论 LF 还是 CRLF 都不会踩到「锚点匹配 0 处」。
          def read_text(p):
              raw = p.read_bytes().decode("utf-8")
              crlf = "\r\n" in raw
              return (raw.replace("\r\n", "\n") if crlf else raw), crlf

          def write_text(p, text, crlf):
              p.write_bytes((text.replace("\n", "\r\n") if crlf else text).encode("utf-8"))

          cfg_p = pathlib.Path("libs/hbb_common/src/config.rs")
          com_p = pathlib.Path("src/common.rs")
          for p in (cfg_p, com_p):
              if not p.is_file():
                  die("找不到 %s ，子模块可能没拉下来" % p)

          cfg, cfg_crlf = read_text(cfg_p)
          cfg, n1 = re.subn(r'pub const RENDEZVOUS_SERVERS: &\[&str\] = &\[[^\]]*\];',
                            'pub const RENDEZVOUS_SERVERS: &[&str] = &["%s"];' % ID, cfg)
          if n1 != 1:
              die("RENDEZVOUS_SERVERS 锚点匹配 %d 处，期望 1 处" % n1)
          cfg, n2 = re.subn(r'pub const RS_PUB_KEY: &str = "[^"]*";',
                            'pub const RS_PUB_KEY: &str = "%s";' % KEY, cfg)
          if n2 != 1:
              die("RS_PUB_KEY 锚点匹配 %d 处，期望 1 处" % n2)
          write_text(cfg_p, cfg, cfg_crlf)

          com, com_crlf = read_text(com_p)
          old = '    "https://admin.rustdesk.com".to_owned()\n}'
          new = '    "%s".to_owned()\n}' % API
          if com.count(old) != 1:
              die("API 服务器锚点匹配 %d 处，期望 1 处" % com.count(old))
          write_text(com_p, com.replace(old, new), com_crlf)

          # 立刻校验，确保真的写进去了
          cfg = cfg_p.read_text(encoding="utf-8")
          com = com_p.read_text(encoding="utf-8")
          assert ('&["%s"];' % ID) in cfg, "RENDEZVOUS_SERVERS 写入失败"
          assert ('"%s";' % KEY) in cfg, "RS_PUB_KEY 写入失败"
          assert ('"%s".to_owned()' % API) in com, "API 服务器写入失败"
          assert "rs-ny.rustdesk.com" not in cfg, "仍残留官方公共服务器地址"

          print("=" * 60)
          print("已写入源码：")
          print("  ID  服务器 : %s:21116" % ID)
          print("  中继服务器 : %s（由 ID 服务器下发，无需写死）" % RELAY)
          print("  API 服务器 : %s" % API)
          print("  公钥       : %s...%s" % (KEY[:8], KEY[-6:]))
          print("=" * 60)
          PYEOF

      - name: Show patched lines
        shell: bash
        run: |
          grep -n "RENDEZVOUS_SERVERS\|RS_PUB_KEY" libs/hbb_common/src/config.rs | head -5
          grep -n "https://api" src/common.rs | head -5

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        id: flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          [[ "3.24.5" == ${{ env.FLUTTER_VERSION }} ]] && git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - name: Report actual rustc version
        shell: bash
        run: |
          echo "=== 这是本次验证的关键：必须是 1.91 或更高 ==="
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022-custom

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-x64-windows-static-rel-out.log" || true
        shell: bash

      - name: Complete Cargo.lock for the --locked build
        shell: bash
        run: |
          # build.py 里所有 cargo 调用都带 --locked，开启 iroh 后必须先补全 lockfile。
          # 实测 cargo 的更新是纯增量的（既有依赖版本一个都不变），
          # 所以这里只补新增依赖，不会顺带升级任何东西。
          cargo fetch
          echo "Cargo.lock 中 iroh 相关条目数: $(grep -c '^name = "iroh' Cargo.lock)"

      - name: Build rustdesk
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram --iroh
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums

            $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1\.4\.zip$').Matches.Groups[1].Value
            $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
            $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
            $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
            if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums match, extract the file."
                Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
                mkdir ./rustdesk/drivers
                mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
                Expand-Archive printer_driver_adapter.zip -DestinationPath .
                mv -Force .\printer_driver_adapter.dll ./rustdesk
            } elseif ($checksum_driver -ne $downloadsum_driver.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums do not match, ignore the file."
            } else {
                Write-Output "printer_driver_adapter.dll, checksums do not match, ignore the file."
            }
          } catch {
              Write-Host "Ingore the printer driver error."
          }

      - name: Verify built DLL contains our server config
        shell: bash
        continue-on-error: true
        run: |
          python3 - <<'PYEOF'
          import os
          data = open(r"rustdesk/librustdesk.dll", "rb").read()
          for s in (os.environ["RS_ID_SERVER"], os.environ["RS_API_SERVER"]):
              print(("  FOUND   " if s.encode() in data else "  MISSING ") + s)
          PYEOF

      - name: find Runner.res
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" == "" ]; then
            echo "Runner.res: not found";
          else
            echo "Runner.res: $runner_res";
            cp $runner_res ./libs/portable/Runner.res;
            ls -l ./libs/portable/Runner.res;
          fi

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      - name: Upload unsigned app directory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-custom-iroh-windows-x64-unsigned
          path: rustdesk

      - name: Build self-extracted executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/rustdesk-${{ env.VERSION }}-x86_64.exe

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Build msi
        run: |
          pushd ./res/msi
          python preprocess.py --arp -d ../../rustdesk
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          mv $msi.FullName ../../SignOutput/rustdesk-${{ env.VERSION }}-x86_64.msi
          sha256sum ../../SignOutput/rustdesk-*.msi

      - name: Publish Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          prerelease: true
          tag_name: ${{ env.TAG_NAME }}
          files: |
            ./SignOutput/rustdesk-*.msi
            ./SignOutput/rustdesk-*.exe
