# NERV Desk 构建期品牌清单（唯一事实来源 / single source of truth）
#
# 这个文件决定"一个全新的 NERV Desk 客户端默认连哪台服务器、用哪把公钥校验服务器身份"。
# 改这里 -> 跑 scripts/gen-branding.py -> 重新构建。
#
# 安全说明：public_key 是 ID 服务器的 **公开** ed25519 公钥，设计上就要分发给每个客户端，
# 与上游 RustDesk 仓库里逐字存在的 RS_PUB_KEY 同一性质。私钥不在本仓库、不在本机。
# 任何真实密码/PIN/token/私钥一律不得写进本文件。

[server]
# ID / 会合服务器（Rendevous）。不写端口时按 21116 处理。
id_server = "id.nervcode.eu.org"
# 中继服务器（Relay）。不写端口时按 21117 处理。
relay_server = "relay.nervcode.eu.org"
# API 服务器（RustDesk-API，用于登录/地址簿/审计等）。
api_server = "https://api.nervcode.eu.org"
# ID 服务器公钥，客户端用它验证服务器签名。
public_key = "HJtH5YUqy6Dz8FHfypUKPJSGoxbBeSgtDsahkT6MBo4="

# 额外的 OEM 默认值（可选表）。键名 = 客户端内部的 option 名；每个键进哪一张设置表由
# scripts/gen-branding.py 的 KEY_TARGETS 决定 —— 放错表在运行期是静默无效的。
# 这里只写"与代码隐含默认值确实不同"的值：写上同样的值是 no-op，会让人误以为这里有 OEM 差异。
[defaults]
# 允许在本机隐藏"连接管理"窗口。隐含默认是空串（= 不允许）。
# hide_cm() 另外还要求"仅审批模式 + 只用固定密码"，所以这不会降低安全性：
# libs/hbb_common/src/password_security.rs:88。
allow-hide-cm = "Y"

# 默认不创建系统托盘图标。读取点 src/tray.rs:27（非 macOS 直接不启动托盘进程）与
# src/tray.rs:189（macOS 不创建图标）。代价（有意接受）：本键属 BUILTIN_SETTINGS，
# 没有 OVERWRITE 变体、也没有对应的用户设置项 ⇒ 用户无法在界面里改回来，只能用签名
# custom.txt 覆盖或重新构建；非 macOS 上关掉主窗口后没有托盘入口，重新启动程序即可
# 重新打开主窗口（hide-tray 只决定要不要创建托盘图标，不影响主进程与已建立的连接）。
hide-tray = "Y"

# 固定密码"出厂即锁死"：不允许在界面里修改或清除永久密码。读取点
# libs/hbb_common/src/config.rs:1187（is_disable_change_permanent_password）
# 与 :1305（set_permanent_password 的最内层拒绝）。
# 有意保留的唯一例外：已安装 + 管理员身份在本机执行 `nervdesk --password <值>`
# 仍可设置一次（见 src/core_main.rs 与 src/ipc.rs 的 permanent-password-admin）。
# 代价：本键属 BUILTIN_SETTINGS，没有 OVERWRITE 变体、也没有对应的用户设置项
# ⇒ 用户无法在界面里改回来；删掉配置文件也无效，apply_defaults() 每次启动都会
# 重新播种。要解除只能改本文件后重新构建，或用签名 custom.txt 覆盖。
disable-change-permanent-password = "Y"
